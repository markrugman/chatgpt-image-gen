<script>
const icons={back:'M15 18l-6-6 6-6',down:'M6 9l6 6 6-6',close:'M6 6l12 12M18 6L6 18',more:'M5 12h.01M12 12h.01M19 12h.01',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',plus:'M12 5v14M5 12h14',home:'M3 10l9-7 9 7v11H3zM9 21v-8h6v8',pages:'M6 3h10l4 4v14H6zM3 6v15',assets:'M3 4h18v16H3zM3 16l6-6 5 5 3-3 4 4M16 8h.01',upload:'M12 16V3M7 8l5-5 5 5M3 16v5h18v-5',template:'M3 3h8v18H3zM15 3h6v8h-6zM15 15h6v6h-6z',history:'M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v5l3 2',chat:'M21 4H3v14h5l4 4v-4h9z',canvas:'M3 3h18v18H3z',tools:'M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6',check:'M4 12l5 5L20 6',export:'M12 3v12M7 10l5 5 5-5M4 16v5h16v-5',folder:'M3 6V4h7l2 3h9v13H3z',settings:'M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6',undo:'M3 10h10a7 7 0 0 1 7 7M3 10l5-5M3 10l5 5',redo:'M21 10H11a7 7 0 0 0-7 7M21 10l-5-5M21 10l-5 5',edit:'M4 16L16 4l4 4L8 20H4z',copy:'M8 8h13v13H8zM3 16V3h13',size:'M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6',spark:'M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z'};
function ic(n){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[n]||icons.canvas}"/></svg>`}
function b(n,label,cls=''){return `<button class="${cls}" aria-label="${label}">${ic(n)}${label&& !cls.includes('icon')?`<span>${label}</span>`:''}</button>`}
function glass(color='#ffa550'){return `<svg viewBox="0 0 120 180" fill="none"><path d="M16 30h88L60 108z" fill="${color}" stroke="#fff0d6" stroke-width="4"/><path d="M60 108v49m-26 2h52" stroke="#fff0d6" stroke-width="5" stroke-linecap="round"/><path d="M24 45h72" stroke="#ffd8ac" stroke-width="3"/><circle cx="87" cy="26" r="19" fill="#f6be5b" stroke="#fff0d6" stroke-width="3"/><path d="M87 9v33M70 26h34M75 14l24 24M75 38l24-24" stroke="#ffedba" stroke-width="2"/><path d="M39 19l29 69" stroke="#fff0d6" stroke-width="3"/></svg>`}
function art(cls='',title='AFTER<br>HOURS'){return `<div class="artwrap"><div class="poster ${cls}"><div class="venue">THE COURTYARD · DERBY</div><div class="star">✳</div><div class="arttitle">${title}</div><div class="artsub">GOOD COMPANY. GREAT COCKTAILS.</div><div class="cocktail">${glass()}</div><div class="artbottom">FRIDAY FROM 7PM<br>YOUR EVENING STARTS HERE.</div></div></div>`}
const tools=[['pages','Pages'],['assets','Assets'],['upload','Uploads'],['template','Templates'],['history','History']];
function rail(){return `<nav class="rail" aria-label="Design tools">${tools.map(([n,l])=>b(n,l,l==='Assets'?'active':'')).join('')}<div class="bottom">${b('settings','Settings')}</div></nav>`}
function header(){return `<header class="header">${b('back','Back to workspace','icon')}<div class="grow"><div class="row"><span class="title">After Hours · Friday</span><span class="context muted"> / Courtyard / Autumn campaign</span></div><div class="saved">${ic('check')}All changes saved</div></div>${b('more','More document actions','icon')}${b('export','Export','primary exportbtn')}<span class="avatar">MR</span></header>`}
function assets(){return `<div class="assetgrid">${['Citrus cocktail','Evening cocktail','Golden cocktail','Berry cocktail'].map((n,i)=>`<article class="assetcard"><div class="assetpreview">${glass(['#ffac56','#e77380','#eab548','#b45c88'][i])}</div><div class="assetname">${n}</div><div class="actions"><button>Place</button><button>Reference</button></div></article>`).join('')}</div>`}
function drawer(){return `<aside class="drawer stack"><div class="row between"><h2>Assets</h2>${b('close','Close tools','icon')}</div><div class="search">${ic('search')}<input aria-label="Search assets" placeholder="Search assets"></div><div class="tabs"><button class="selected">Courtyard</button><button>Shared</button></div><div class="row between"><span class="label">RECENTLY MODIFIED</span></div>${assets()}<p class="caption">Place keeps the original image.<br>Reference guides generation.</p>${b('plus','Create an asset','secondary')}</aside>`}
function status(){return `<footer class="status"><span class="row">${b('undo','Undo','icon')}${b('redo','Redo','icon')}<span class="detail">A3 · 297 × 420 mm</span></span><span class="row"><button>Fit ${ic('down')}</button><span>49%</span><span>·</span><span>Page 1 of 2</span></span></footer>`}
function dock(active='Canvas'){return `<nav class="dock" aria-label="Editor navigation">${[['canvas','Canvas'],['chat','Chat'],['tools','Tools'],['pages','Pages']].map(([n,l])=>b(n,l,active===l?'active':'')).join('')}</nav>`}
function composer(){return `<div class="composer"><div class="tabs"><button class="selected">Generate / Edit</button><button>Discuss</button></div><div class="composebox"><textarea aria-label="Describe your next change" placeholder="Describe your next change…"></textarea><div class="row between">${b('plus','Attach reference','icon')}<button class="primary">Generate ${ic('spark')}</button></div></div><p class="caption" style="margin-top:8px">Changes create a recoverable revision.</p></div>`}
function chat(sheet=false){return `<aside class="chat ${sheet?'sheet':''}">${sheet?'<div class="handle"></div>':''}<div class="chathead row between"><div><strong>Design conversation</strong><p class="caption" style="margin-top:4px">Page 1 · Current revision</p></div>${b(sheet?'close':'more',sheet?'Close Chat':'Chat options','icon')}</div><div class="chatbody"><div class="message user">Create a warm evening cocktail poster for the Courtyard. Bold title, rich plum and sunset orange.</div><div class="message"><div class="who row">${ic('spark')}Image Gen</div><p>The new poster is ready. The title leads the composition, with the cocktail kept clear of the event details.</p></div><div class="success row">${ic('check')}Revision 3 saved · Current</div><div class="message user">Could we make a matching story image?</div><div class="message"><div class="who">Image Gen · Discuss</div><p>Yes. Start a new 9:16 design using this image as a reference to keep the same mood.</p></div></div>${composer()}</aside>`}
function sheet(kind){if(kind==='chat')return `<div class="sheetbackdrop"></div>${chat(true)}`;if(kind==='tools')return `<div class="sheetbackdrop"></div><section class="sheet tools"><div class="handle"></div><div class="sheethead row between"><h2>Assets</h2><div class="row">${b('size','Expand sheet','icon')}${b('close','Close tools','icon')}</div></div><div class="sheetcontent"><div class="toolchooser">${['Assets','Uploads','Templates','History'].map(x=>`<button class="${x==='Assets'?'active':''}">${x}</button>`).join('')}</div><div class="search" style="margin-bottom:12px">${ic('search')}<input aria-label="Search Courtyard assets" placeholder="Search Courtyard assets"></div><p class="caption" style="margin-bottom:14px">Place unchanged, or use as a generation reference.</p>${assets()}</div></section>`;return `<div class="sheetbackdrop"></div><section class="sheet menu"><div class="handle"></div><div class="sheethead row between"><h2>Document</h2>${b('close','Close document menu','icon')}</div><div class="sheetcontent"><div class="menuidentity"><strong>After Hours · Friday</strong><p class="caption">Courtyard / Autumn campaign</p><p class="caption">A3 · 297 × 420 mm · 2 pages</p><span class="saved">${ic('check')}All changes saved</span></div><div class="menugroup">${b('edit','Rename design')}${b('size','Document dimensions')}${b('plus','Use in new design')}</div><div class="menugroup">${b('template','Save as template')}${b('spark','Extract asset')}</div><div class="menugroup">${b('history','Revision history')}${b('pages','View pages')}</div><div class="menugroup">${b('export','Export files')}</div></div></section>`}
function exportpanel(){return `<aside class="panel"><div class="panelhead row between"><h2>Export</h2>${b('close','Close export','icon')}</div><div class="panelbody"><div class="exportpreview">${art()}</div><div class="field"><label>File format</label><div class="select">PNG · Lossless image ${ic('down')}</div><p class="caption">Current page · Page 1 of 2</p></div><div class="field"><label>Document size</label><div class="info"><strong>A3 · 297 × 420 mm</strong><br>Original image: 1024 × 1448 px</div></div><div class="field"><label>Export dimensions</label><div class="row"><div class="select grow">1024 <small>px</small></div><span>×</span><div class="select grow">1448 <small>px</small></div></div><p class="caption">Same pixel dimensions as the source image.<br>Changing export size does not add image detail.</p></div><div class="info row" style="margin-bottom:20px">${ic('check')}Existing transparency is preserved.</div><button class="secondary" style="width:100%;justify-content:space-between">More export options ${ic('down')}</button><p class="caption" style="margin-top:12px">Choose PDF for all pages and print options.</p></div><div class="panelfoot"><p class="caption" style="margin-bottom:10px">PNG · Page 1 · 1024 × 1448 px</p>${b('export','Export PNG','primary')}</div></aside>`}
function editor(name){const isphone=name.includes('phone');const sh=name.startsWith('tools')?'tools':name.startsWith('more')?'more':name.startsWith('chat')?'chat':null;return `<main class="editor">${header()}<div class="body">${rail()}${name==='editor-desktop'?drawer():''}<section class="stage" aria-label="Design canvas"><div class="canvas">${art()}</div>${status()}</section>${name==='editor-desktop'?chat():name==='export-desktop'?exportpanel():''}</div>${dock(sh==='chat'?'Chat':sh==='tools'?'Tools':'Canvas')}${isphone&&sh?sheet(sh):''}</main>`}
function home(){const names=['After Hours · Friday','Summer drinks','Botanical evening','Golden hour'];return `<main class="home"><aside class="homeside"><div class="row brand"><span class="brandmark">${ic('spark')}</span>Image Gen</div><div class="org row"><span class="avatar">C</span><div class="grow"><strong>Courtyard</strong><p class="caption">Organisation</p></div>${ic('down')}</div>${b('plus','Create a design','primary')}<nav>${b('home','Home','active')}${b('folder','Projects')}${b('assets','Assets')}${b('upload','Uploads')}${b('template','Templates')}</nav><div class="label" style="margin-top:12px">PROJECTS</div><nav>${b('folder','Autumn campaign')}${b('folder','Drinks menu')}${b('folder','Weekly events')}</nav><div style="margin-top:auto">${b('settings','Settings')}<div class="row" style="margin-top:18px"><span class="avatar">MR</span><div><strong>Mark Rugman</strong><p class="caption">Personal workspace</p></div></div></div></aside><section class="homecontent"><div class="row between"><div><p class="label" style="margin-bottom:8px">COURTYARD WORKSPACE</p><h1>Your next idea starts here.</h1></div><div class="search">${ic('search')}<input aria-label="Search Courtyard" placeholder="Search designs, projects and libraries"></div></div><div class="sectionhead"><div><h2>Continue designing</h2><p class="caption" style="margin-top:6px">Your latest designs, ready to pick up.</p></div><button>View all designs →</button></div><div class="cards">${names.map((n,i)=>`<article class="designcard"><div class="thumbnail">${art(['','blue','green','gold'][i],['AFTER<br>HOURS','SUMMER<br>DRINKS','BOTANIC<br>NIGHTS','GOLDEN<br>HOUR'][i])}</div><h3>${n}</h3><small>${i?'Weekly events':'Autumn campaign'} · ${['Edited 12 minutes ago','Edited yesterday','Edited 2 days ago','Edited 4 days ago'][i]}</small></article>`).join('')}</div><div class="sectionhead"><h2>Your projects</h2><button>All projects →</button></div><div class="projectcards">${['Autumn campaign','Drinks menu','Weekly events'].map((n,i)=>`<article class="projectcard"><div class="previews">${[0,1,2].map((_,j)=>`<div>${art(['','blue','green'][(i+j)%3])}</div>`).join('')}</div><div class="row between"><h3>${n}</h3>${ic('folder')}</div><small>${[6,4,12][i]} designs · Courtyard</small></article>`).join('')}</div><div class="templatestrip row between"><div><strong>Start with a reusable prompt</strong><p>Templates keep your favourite recipes and configurable inputs together.</p></div>${b('template','Browse Templates','secondary')}</div></section></main>`}
const screen=new URLSearchParams(location.search).get('screen')||'editor-desktop';document.getElementById('app').innerHTML=(screen==='home-desktop'?home():editor(screen))+'<span class="examplemark">IMAGE GEN · DESIGN PROPOSAL · 19 OCT 2026</span>';
</script></html>
